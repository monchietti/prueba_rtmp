http {
    server {
        listen ${HTTP_PORT};
        server_name ${NGINX_HOST};


        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;

        }

        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8; # Tipo MIME para archivos de lista de reproducción HLS
                video/mp2t ts; # Tipo MIME para archivos HLS
            }
            root /tmp;
        }
    }
}